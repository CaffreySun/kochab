# pnpm workspace + 依赖版本目录（catalog）
# 目录是全仓库依赖版本的唯一事实来源：新增依赖必须在 catalog 中先登记版本，
# 包内只写 "catalog:" / "catalog:dev"，避免版本漂移。
packages:
  - apps/*
  - packages/*

catalog:
  # ---- runtime ----
  # React 固定 18.x：TDesign 的命令式 API（MessagePlugin / DialogPlugin / NotificationPlugin）
  # 内部仍调用 React 18 才提供的 ReactDOM.render，React 19 已将其移除。
  # 详见 docs/adr/0002-react-18-for-tdesign-imperative-api.md
  react: ^18.3.1
  react-dom: ^18.3.1
  tdesign-react: ^1.18.4
  tdesign-icons-react: ^0.6.11
  zod: ^4.6.7

  # ---- tauri ----
  '@tauri-apps/api': ^2.12.3
  '@tauri-apps/plugin-dialog': ^2.8.2
  '@tauri-apps/plugin-opener': ^2.7.1

catalogs:
  # ---- build / bundler ----
  dev:
    typescript: ~5.9.3
    vite: ^8.3.4
    '@vitejs/plugin-react': ^5.2.0
    tsup: ^9.0.0

  # ---- testing ----
  test:
    vitest: ^5.0.4
    '@vitest/coverage-v8': ^5.0.4
    jsdom: ^30.1.2
    '@testing-library/react': ^16.3.3
    '@testing-library/dom': ^10.4.2
    '@testing-library/jest-dom': ^7.0.1
    '@testing-library/user-event': ^14.6.8

  # ---- linting / formatting ----
  lint:
    # ESLint 固定 9.x：eslint-plugin-react 7.x 仍依赖 ESLint 9 的 context.getFilename()，
    # 在 ESLint 10 下会直接崩溃。详见 docs/adr/0003-eslint-9-for-plugin-compat.md
    '@eslint/js': ~9.39.5
    eslint: ~9.39.5
    typescript-eslint: ^8.71.2
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-jsonc: ^3.4.2
    globals: ^17.13.0
    prettier: ^3.9.10
    stylelint: ^17.16.0
    stylelint-config-standard: ^40.0.0
    stylelint-config-recommended: ^18.0.0

  # ---- types ----
  types:
    '@types/node': ^26.6.5
    '@types/react': ^18.3.31
    '@types/react-dom': ^18.3.7
