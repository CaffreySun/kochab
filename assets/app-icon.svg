<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0052D9" />
      <stop offset="55%" stop-color="#2A6BFF" />
      <stop offset="100%" stop-color="#00A2FF" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.82" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)" />

  <!-- 手机主体 -->
  <rect x="286" y="196" width="330" height="632" rx="56" fill="url(#screen)" />
  <rect x="286" y="196" width="330" height="120" rx="56" fill="#0B4EC4" fill-opacity="0.16" />
  <circle cx="451" cy="252" r="13" fill="#0B4EC4" fill-opacity="0.35" />
  <rect x="404" y="792" width="94" height="12" rx="6" fill="#0B4EC4" fill-opacity="0.28" />

  <!-- 手机屏幕内的波形，表示「正在投屏」 -->
  <g stroke="#0B4EC4" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round">
    <line x1="336" y1="412" x2="336" y2="530" />
    <line x1="386" y1="380" x2="386" y2="562" />
    <line x1="436" y1="348" x2="436" y2="594" />
    <line x1="486" y1="400" x2="486" y2="542" />
    <line x1="536" y1="368" x2="536" y2="574" />
  </g>

  <!-- 投屏信号 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round">
    <path d="M690 452 A176 176 0 0 1 690 648" stroke-opacity="0.95" />
    <path d="M754 386 A268 268 0 0 1 754 714" stroke-opacity="0.65" />
  </g>
  <circle cx="666" cy="550" r="30" fill="#FFFFFF" />
</svg>