name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/* -> target

      - name: 安装 JS 依赖
        run: pnpm install --frozen-lockfile

      - name: 校验锁文件与 catalog 一致
        run: pnpm exec prettier --check pnpm-workspace.yaml package.json

      - name: 环境自检
        run: pnpm doctor

      - name: 全量校验
        run: pnpm verify

  package:
    name: 打包 (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/* -> target

      - run: pnpm install --frozen-lockfile

      # Windows 需要 MSVC 生成工具；macOS 需要 Xcode CLT，runner 镜像均已预装。
      - name: 打包桌面应用
        run: pnpm --filter @kochab/desktop run package
